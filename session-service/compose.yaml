services:
  session-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-session_service}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${SESSION_DB_PORT:-5432}:5432"
    volumes:
      - session-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-session_service}"]
      interval: 5s
      timeout: 3s
      retries: 10

  session-service:
    build: .
    depends_on:
      session-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://session-db:5432/${DB_NAME:-session_service}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${SESSION_SERVICE_PORT:-8080}:8080"

volumes:
  session-db-data: